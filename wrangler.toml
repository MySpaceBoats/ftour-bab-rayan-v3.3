# Cloudflare Workers configuration for Ftour Bab Rayan
name = "ftour-bab-rayan"
main = "worker/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Build configuration
[build]
command = "pnpm build:worker"

# Environment variables (secrets should be set via wrangler secret)
[vars]
NODE_ENV = "production"

# Routes configuration
[[routes]]
pattern = "ftourbabrayan.ma/api/*"
zone_name = "ftourbabrayan.ma"

# Development settings
[dev]
port = 8787
local_protocol = "http"
