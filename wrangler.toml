name = "ftour-bab-rayan-v2"
main = "dist/worker.js"
compatibility_date = "2026-02-13"

[assets]
directory = "dist/public"
# admin./communityspace. are served by this Worker: deep links and refreshes must fall back to index.html (Pages did this via _routes.json)
not_found_handling = "single-page-application"

# Assistant IA: free OpenRouter models, tried in order (secret OPENROUTER_API_KEY via `wrangler secret put`)
[vars]
AI_MODELS = "openrouter/free"

[observability]
[observability.logs]
enabled = false
invocation_logs = true

# Cron trigger: ensure 3 Ramadan days are always open for registration
# Runs every day at 00:05 Casablanca time (UTC+1 during Ramadan = 23:05 UTC)
[triggers]
crons = ["5 23 * * *"]

# Gallery: D1 (rows) + R2 (images)
[[d1_databases]]
binding = "DB"
database_name = "ftour-bab-rayan-prod-db"
database_id = "46e15f77-73c9-415a-a50a-0067b54719eb"

[[r2_buckets]]
binding = "GALLERY_MEDIA"
bucket_name = "ftour-bab-rayan-prod-media"

# Hub realtime chat: one global Durable Object (presence + push)
[[durable_objects.bindings]]
name = "HUB_CHAT"
class_name = "HubChat"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HubChat"]

# Superassistant admin: Cloudflare Container (terminal git/node/pnpm). Image publique tirée par Cloudflare : pas de Docker local.
# Garder la version alignée sur @cloudflare/sandbox (package.json). pnpm est installé au premier usage (worker/superassistant-tools.ts).
[[containers]]
class_name = "Sandbox"
image = "docker.io/cloudflare/sandbox:0.7.0"
instance_type = "standard-1"
max_instances = 1

[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Sandbox"]

# ---- Staging: gallery on D1 + R2 ----
[env.staging]
name = "ftour-bab-rayan-staging"

[env.staging.vars]
AI_MODELS = "openrouter/free"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ftour-bab-rayan-staging-db"
database_id = "88a6071f-a573-4059-97b1-e8b78eced3cc"

[[env.staging.r2_buckets]]
binding = "GALLERY_MEDIA"
bucket_name = "ftour-bab-rayan-staging-media"

# staging shares the Supabase project: never run the Ramadan-days cron there
[env.staging.triggers]
crons = []

[[env.staging.durable_objects.bindings]]
name = "HUB_CHAT"
class_name = "HubChat"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["HubChat"]
