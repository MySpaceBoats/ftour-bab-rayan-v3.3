# Cloudflare Workers configuration for Ftour Bab Rayan
name = "ftour-bab-rayan"
main = "worker/index.ts"

# nodejs_compat needs 2024-09-23 or later
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "pnpm build:worker"

[vars]
NODE_ENV = "production"

routes = [
  { pattern = "www.ftourbabrayan.ma/api/*", zone_name = "www.ftourbabrayan.ma" }
]

[dev]
port = 8787
local_protocol = "http"
